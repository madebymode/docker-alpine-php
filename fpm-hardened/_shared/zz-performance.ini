; Production defaults shared by the hardened PHP-FPM images.
; https://www.php.net/manual/en/opcache.configuration.php
; https://craftcms.com/docs/5.x/requirements.html
; https://serversideup.net/open-source/docker-php/docs/guide/production-performance-tuning
; https://symfony.com/doc/current/performance.html#configure-opcache-for-maximum-performance
; https://frankenphp.dev/docs/performance/
; Per-script PHP allocation limit, separate from the shared OPcache budget.
memory_limit=512M

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531
opcache.force_restart_timeout=180
opcache.save_comments=1
opcache.enable_file_override=0

; Deploy into a fresh container. Override to 1 for files edited in place.
opcache.validate_timestamps=0

; JIT is opt-in after workload-specific correctness and performance testing.
; Use disable rather than off to prevent enabling it within a request.
opcache.jit=disable
opcache.jit_buffer_size=0

; Preloading requires an application-specific script and remains opt-in.
opcache.preload=
opcache.preload_user=

realpath_cache_size=4096K
realpath_cache_ttl=600
expose_php=Off
