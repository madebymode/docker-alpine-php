name: Update PHP Alpine Versions

on:
  schedule:
    - cron: '0 9 * * *' # Daily at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: php-alpine-version-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-php-alpine-versions:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      matrix: ${{ steps.commit.outputs.matrix }}
      ref: ${{ steps.commit.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.x'

      - name: Fetch and apply upstream PHP Alpine updates
        run: python .github/scripts/update_php_alpine_versions.py

      - name: Commit updated versions
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'cli/*/.env' 'fpm/*/.env'

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No PHP Alpine updates detected."
            exit 0
          fi

          MATRIX=$(git diff --cached --name-only | jq -Rsc '
            [split("\n")[] | select(length > 0) | split("/") |
              {type: .[0], version: .[1]}] | unique
          ')

          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git commit -m "chore: update tracked PHP Alpine versions $(date +%Y-%m-%d)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-updated-images:
    needs: update-php-alpine-versions
    if: needs.update-php-alpine-versions.outputs.changed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      image_matrix: ${{ needs.update-php-alpine-versions.outputs.matrix }}
      ref: ${{ needs.update-php-alpine-versions.outputs.ref }}
    secrets: inherit
